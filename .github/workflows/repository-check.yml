name: repository-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_repository.py

  executable-learning-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oriclabs/biolang
          path: _core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _core -> target
      - name: Build BioLang
        run: cargo build --manifest-path _core/Cargo.toml -p bl-cli
      - name: Run every example
        env:
          BIOLANG_CLI: ${{ github.workspace }}/_core/target/debug/bl
        run: node scripts/check-examples-run.mjs

      - name: Check MSMB examples
        env:
          BIOLANG_CLI: ${{ github.workspace }}/_core/target/debug/bl
        run: node scripts/check-msmb.mjs
      - name: Audit biostatistics code blocks
        shell: pwsh
        run: ./scripts/audit-biostatistics-book.ps1 -BioLangExe "${{ github.workspace }}/_core/target/debug/bl"
